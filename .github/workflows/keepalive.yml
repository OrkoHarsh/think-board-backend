# External wake-up for Railway: pings /actuator/health every ~3 minutes.
# Required secret: HEALTHCHECK_URL (e.g. https://your-app.up.railway.app/actuator/health)
name: Keepalive

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is not set — skip"
            exit 0
          fi
          curl -fsS --max-time 30 "$HEALTHCHECK_URL"
          echo
          echo "ok"
