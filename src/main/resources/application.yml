server:
  port: 8080

spring:
  application:
    name: nimbusboard-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      # Recycle/keepalive before Railway Postgres/proxy drops idle TCP (~5–7 min)
      idle-timeout: 120000
      max-lifetime: 240000
      keepalive-time: 30000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@thinkboard.local}
    # Prefer Brevo HTTP API (xkeysib-...) over SMTP — avoids SMTP auth mismatches
    brevo-api-key: ${BREVO_API_KEY:}
  redis:
    enabled: ${REDIS_ENABLED:false}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 28800000    # 8 hours
    refresh-token-expiration-ms: 604800000 # 7 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:llama-3.3-70b-versatile}
    base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
    max-tokens: ${OPENAI_MAX_TOKENS:2000}

  ai:
    mock-enabled: ${AI_MOCK_ENABLED:false}
    mock-fallback-on-auth-error: ${AI_MOCK_FALLBACK:true}
    guardrails:
      # Optional comma-separated terms to block in prompts, on top of the built-in checks.
      blocked-terms: ${AI_BLOCKED_TERMS:}

  rate-limit:
    ai-requests-per-minute: ${AI_RATE_LIMIT:10}
    # UTC calendar day; resets at 00:00 UTC
    ai-requests-per-day: ${AI_DAILY_LIMIT:3}
    unlimited-emails: ${AI_UNLIMITED_EMAILS:hrsh0412@gmail.com}

  keepalive:
    # SELECT 1 on this interval to keep Hikari connections warm on Railway
    db-interval-ms: ${DB_KEEPALIVE_INTERVAL_MS:120000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.nimbusboard: DEBUG
    org.springframework.web.socket: DEBUG
